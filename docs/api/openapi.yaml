                required:
                - etiqueta
                - total
                additionalProperties: false
            vacantes_por_categoria:
              type: array
              items:
                type: object
                properties:
                  etiqueta:
                    type: string
                  total:
                    type: integer
                required:
                - etiqueta
                - total
                additionalProperties: false
            evolucion_mensual:
              type: array
              items:
                type: object
                properties:
                  mes:
