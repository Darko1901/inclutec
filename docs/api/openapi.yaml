                  postulaciones:
                    type: integer
                  contrataciones:
                    type: integer
                required:
                - mes
                - postulaciones
                - contrataciones
                additionalProperties: false
            brecha_ajustes:
              type: array
              items:
                type: object
                properties:
                  etiqueta:
                    type: string
                  solicitados:
                    type: integer
                  ofrecidos:
                    type: integer
