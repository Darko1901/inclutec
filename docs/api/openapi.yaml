              - entrevista
              - empresa
              - reporte
              - vacante
            id:
              type: integer
          required:
          - tipo
          - id
          additionalProperties: false
          description: Recurso al que lleva la notificación al tocarla.
        leida:
          type: boolean
        creado_en:
          type: string
          format: date-time
      required:
      - id
      - tipo
      - titulo
      - mensaje
      - referencia
      - leida
      - creado_en
      additionalProperties: false
      examples:
      - id: 1
        tipo: cambio_estado
        titulo: Tu postulación avanzó
        mensaje: Tu postulación a Técnico de soporte de TI pasó a Entrevista.
        referencia:
          tipo: postulacion
