openapi: 3.1.0
info:
  title: API de IncluTec
  version: '1.0'
  description: 'Contrato del API REST de IncluTec. Fuente: docs/api/contrato.md.'
servers:
- url: http://localhost:8000/api/v1
  description: Desarrollo local
tags:
- name: Autenticación y cuenta
- name: Catálogos
- name: Notificaciones
- name: Perfil y CV del candidato
- name: Empresas
- name: Vacantes y compatibilidad
- name: Postulaciones
- name: Horarios y entrevistas
- name: Reportes
- name: 'Administración: estadísticas'
- name: 'Administración: usuarios'
- name: 'Administración: empresas'
- name: 'Administración: vacantes'
- name: 'Administración: catálogos'
- name: 'Administración: reportes'
paths:
  /auth/login:
    post:
      tags:
      - Autenticación y cuenta
      summary: Iniciar sesión
      operationId: post_auth_login
      description: "Devuelve el token y los datos del usuario. La app móvil rechaza al administrador y el panel web acepta\
        \ solo al administrador; esa regla la aplica cada cliente con `usuario.rol`. Tras 5 intentos fallidos con el mismo\
        \ correo, el acceso se bloquea 15 minutos.\n\n**Rol:** público  \n**Trazabilidad:** MOV-01 RF-02, WEB-01 RF-02 · CU-02,\
        \ CU-19"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              correo: mariana.lopez@correo.mx
              contrasena: Inclutec2026
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzIiwicm9sIjoiY2FuZGlkYXRvIiwiZXhwIjoxNzkxMDgwMDAwfQ.firma
                token_type: bearer
                expira_en: '2026-10-04T02:00:00Z'
                usuario:
                  id: 3
                  correo: mariana.lopez@correo.mx
                  nombre: Mariana
                  apellidos: López García
                  telefono: '4427654321'
                  rol: candidato
                  estado: activo
                  empresa: null
                  consentimiento_sensibles: true
        '401':
          description: '`credenciales_invalidas`: Correo o contraseña incorrectos (mismo mensaje en ambos casos).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                credenciales_invalidas:
                  value:
                    detail: Correo o contraseña incorrectos (mismo mensaje en ambos casos).
                    codigo: credenciales_invalidas
                    campos: null
        '422':
          description: '`validacion`: Algún campo no cumple el formato; `campos` indica cuál.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    detail: Algún campo no cumple el formato; `campos` indica cuál.
                    codigo: validacion
                    campos: null
        '423':
          description: '`cuenta_suspendida`: La cuenta está suspendida o dada de baja.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cuenta_suspendida:
                  value:
                    detail: La cuenta está suspendida o dada de baja.
                    codigo: cuenta_suspendida
                    campos: null
        '429':
          description: '`demasiados_intentos`: Cinco intentos fallidos; incluye el encabezado `Retry-After` en segundos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                demasiados_intentos:
                  value:
                    detail: Cinco intentos fallidos; incluye el encabezado `Retry-After` en segundos.
                    codigo: demasiados_intentos
                    campos: null
  /auth/me:
    get:
      tags:
      - Autenticación y cuenta
      summary: Usuario de la sesión
      operationId: get_auth_me
      description: "Sirve para validar un token guardado al abrir la app o el panel.\n\n**Rol:** cualquier usuario con sesión\
        \  \n**Trazabilidad:** MOV-00 RF-02 · CU-01"
      security:
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 3
                correo: mariana.lopez@correo.mx
                nombre: Mariana
                apellidos: López García
                telefono: '4427654321'
                rol: candidato
                estado: activo
                empresa: null
                consentimiento_sensibles: true
        '401':
          description: '`no_autenticado`: Falta el token, es inválido o ya venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  value:
                    detail: Falta el token, es inválido o ya venció.
                    codigo: no_autenticado
                    campos: null
        '423':
          description: '`cuenta_suspendida`: La cuenta fue suspendida después de emitir el token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cuenta_suspendida:
                  value:
                    detail: La cuenta fue suspendida después de emitir el token.
                    codigo: cuenta_suspendida
                    campos: null
  /auth/logout:
    post:
      tags:
      - Autenticación y cuenta
      summary: Cerrar sesión
      operationId: post_auth_logout
      description: "El JWT no se revoca en el servidor (expira solo); el cliente lo borra. Si se envía el token push, el dispositivo\
        \ se da de baja.\n\n**Rol:** cualquier usuario con sesión  \n**Trazabilidad:** CAN-03 RF-06"
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
            example:
              expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
      responses:
        '204':
          description: Sin contenido
        '401':
          description: '`no_autenticado`: Falta el token, es inválido o ya venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  value:
                    detail: Falta el token, es inválido o ya venció.
                    codigo: no_autenticado
                    campos: null
  /auth/registro/candidato:
    post:
      tags:
      - Autenticación y cuenta
      summary: Registrar candidato
      operationId: post_auth_registro_candidato
      description: "Crea la cuenta y su perfil vacío y devuelve la sesión iniciada. `consentimiento_sensibles = false` crea\
        \ la cuenta con la sección de necesidades de ajuste deshabilitada.\n\n**Rol:** público  \n**Trazabilidad:** MOV-02\
        \ RF-02, RF-04 a RF-07 · CU-03"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCandidato'
            example:
              nombre: Mariana
              apellidos: López García
              correo: mariana.lopez@correo.mx
              telefono: '4427654321'
              municipio_id: 2
              contrasena: Inclutec2026
              acepta_aviso: true
              consentimiento_sensibles: true
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzIiwicm9sIjoiY2FuZGlkYXRvIiwiZXhwIjoxNzkxMDgwMDAwfQ.firma
                token_type: bearer
                expira_en: '2026-10-04T02:00:00Z'
                usuario:
                  id: 3
                  correo: mariana.lopez@correo.mx
                  nombre: Mariana
                  apellidos: López García
                  telefono: '4427654321'
                  rol: candidato
                  estado: activo
                  empresa: null
                  consentimiento_sensibles: true
        '409':
          description: '`correo_duplicado`: El correo ya está registrado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                correo_duplicado:
                  value:
                    detail: El correo ya está registrado.
                    codigo: correo_duplicado
                    campos: null
        '422':
          description: '`validacion`: Algún campo no cumple el formato; `campos` indica cuál.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    detail: Algún campo no cumple el formato; `campos` indica cuál.
                    codigo: validacion
                    campos: null
  /auth/registro/reclutador:
    post:
      tags:
      - Autenticación y cuenta
      summary: Registrar reclutador y empresa
      operationId: post_auth_registro_reclutador
      description: "Crea la cuenta del reclutador y la empresa en estado «pendiente» y devuelve la sesión iniciada. En `usuario.empresa`\
        \ viene el estado de la empresa.\n\n**Rol:** público  \n**Trazabilidad:** MOV-02 RF-03 a RF-07 · CU-03"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroReclutador'
            example:
              reclutador:
                nombre: Laura
                apellidos: Hernández Ruiz
                puesto: Coordinadora de Recursos Humanos
                correo: rh@tecnoqro.mx
                telefono: '4421234567'
                contrasena: Inclutec2026
              empresa:
                razon_social: Tecnologías Querétaro S.A. de C.V.
                nombre_comercial: TecnoQro
                rfc: TQU150312AB1
                sector_id: 4
                tamano_empresa_id: 3
                municipio_id: 3
              acepta_aviso: true
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzIiwicm9sIjoiY2FuZGlkYXRvIiwiZXhwIjoxNzkxMDgwMDAwfQ.firma
                token_type: bearer
                expira_en: '2026-10-04T02:00:00Z'
                usuario:
                  id: 3
                  correo: mariana.lopez@correo.mx
                  nombre: Mariana
                  apellidos: López García
                  telefono: '4427654321'
                  rol: candidato
                  estado: activo
                  empresa: null
                  consentimiento_sensibles: true
        '409':
          description: '`correo_duplicado`: El correo ya está registrado. · `rfc_duplicado`: Otra empresa ya registró ese
            RFC; `campos` marca `empresa.rfc`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                correo_duplicado:
                  value:
                    detail: El correo ya está registrado.
                    codigo: correo_duplicado
                    campos: null
                rfc_duplicado:
                  value:
                    detail: Otra empresa ya registró ese RFC; `campos` marca `empresa.rfc`.
                    codigo: rfc_duplicado
                    campos: null
        '422':
          description: '`validacion`: Algún campo no cumple el formato; `campos` indica cuál.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    detail: Algún campo no cumple el formato; `campos` indica cuál.
                    codigo: validacion
                    campos: null
  /auth/password/solicitar:
    post:
      tags:
      - Autenticación y cuenta
      summary: Solicitar código de recuperación
      operationId: post_auth_password_solicitar
      description: "Envía un código de 6 dígitos por correo, válido 15 minutos. Responde lo mismo exista o no la cuenta. Para\
        \ reenviar deben pasar 60 s desde el envío anterior.\n\n**Rol:** público  \n**Trazabilidad:** MOV-03 RF-01, RF-04\
        \ · CU-04"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCodigo'
            example:
              correo: mariana.lopez@correo.mx
      responses:
        '202':
          description: Aceptado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                detail: Si el correo está registrado, te enviamos un código de 6 dígitos.
        '429':
          description: '`reenvio_prematuro`: Aún no pasan 60 s; incluye `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reenvio_prematuro:
                  value:
                    detail: Aún no pasan 60 s; incluye `Retry-After`.
                    codigo: reenvio_prematuro
                    campos: null
  /auth/password/verificar:
    post:
      tags:
      - Autenticación y cuenta
      summary: Verificar código
      operationId: post_auth_password_verificar
      description: "Comprueba el código sin consumirlo, para pasar al paso de nueva contraseña. Cada intento fallido cuenta\
        \ (máximo 5).\n\n**Rol:** público  \n**Trazabilidad:** MOV-03 RF-02 · CU-04"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacionCodigo'
            example:
              correo: mariana.lopez@correo.mx
              codigo: '482913'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                detail: Código correcto.
        '400':
          description: '`codigo_invalido`: Código incorrecto; el mensaje dice cuántos intentos quedan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                codigo_invalido:
                  value:
                    detail: Código incorrecto; el mensaje dice cuántos intentos quedan.
                    codigo: codigo_invalido
                    campos: null
        '410':
          description: '`codigo_vencido`: El código venció o se agotaron los 5 intentos; hay que pedir otro.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                codigo_vencido:
                  value:
                    detail: El código venció o se agotaron los 5 intentos; hay que pedir otro.
                    codigo: codigo_vencido
                    campos: null
  /auth/password/restablecer:
    post:
      tags:
      - Autenticación y cuenta
      summary: Restablecer contraseña
      operationId: post_auth_password_restablecer
      description: "Valida de nuevo el código, guarda la nueva contraseña y marca el código como usado.\n\n**Rol:** público\
        \  \n**Trazabilidad:** MOV-03 RF-03 · CU-04"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Restablecimiento'
            example:
              correo: mariana.lopez@correo.mx
              codigo: '482913'
              contrasena: NuevaClave2026
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                detail: Tu contraseña se actualizó. Ya puedes iniciar sesión.
        '400':
          description: '`codigo_invalido`: Código incorrecto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                codigo_invalido:
                  value:
                    detail: Código incorrecto.
                    codigo: codigo_invalido
                    campos: null
        '410':
          description: '`codigo_vencido`: El código venció o ya se usó.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                codigo_vencido:
                  value:
                    detail: El código venció o ya se usó.
                    codigo: codigo_vencido
                    campos: null
        '422':
          description: '`validacion`: Algún campo no cumple el formato; `campos` indica cuál.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    detail: Algún campo no cumple el formato; `campos` indica cuál.
                    codigo: validacion
                    campos: null
  /auth/password:
    put:
      tags:
      - Autenticación y cuenta
      summary: Cambiar contraseña
      operationId: put_auth_password
      description: "**Rol:** cualquier usuario con sesión  \n**Trazabilidad:** CAN-03 RF-06, REC-01 RF-05"
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioContrasena'
            example:
              contrasena_actual: Inclutec2026
              contrasena_nueva: NuevaClave2026
      responses:
        '204':
          description: Sin contenido
        '400':
          description: '`contrasena_incorrecta`: La contraseña actual no coincide.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                contrasena_incorrecta:
                  value:
                    detail: La contraseña actual no coincide.
                    codigo: contrasena_incorrecta
                    campos: null
        '401':
          description: '`no_autenticado`: Falta el token, es inválido o ya venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  value:
                    detail: Falta el token, es inválido o ya venció.
                    codigo: no_autenticado
                    campos: null
        '422':
          description: '`validacion`: Algún campo no cumple el formato; `campos` indica cuál.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    detail: Algún campo no cumple el formato; `campos` indica cuál.
                    codigo: validacion
                    campos: null
  /catalogos/{tipo}:
    get:
      tags:
      - Catálogos
      summary: Catálogo activo
      operationId: get_catalogos_tipo
      description: "Devuelve un arreglo (sin paginar) de los registros activos, ordenados por nombre (niveles educativos por\
        \ `orden`). `tipo`: `entidades`, `municipios`, `modalidades`, `jornadas`, `tipos-contrato`, `niveles-educativos`,\
        \ `sectores`, `tamanos-empresa`, `categorias`, `habilidades`, `ajustes`, `motivos-reporte`.\n\n**Rol:** público (también\
        \ se usa con sesión)  \n**Trazabilidad:** API RF-11, CAN-04 RF-04 · CU-03, CU-15"
      parameters:
      - name: tipo
        in: path
        required: true
        schema:
          type: string
      - name: entidad_id
        in: query
        required: false
        description: 'Solo `municipios`: filtra por entidad.'
        schema:
          type: integer
      - name: categoria_id
        in: query
        required: false
        description: 'Solo `habilidades`: filtra por categoría.'
        schema:
          type: integer
      - name: q
        in: query
        required: false
        description: 'Solo `habilidades`: autocompletado (mínimo 2 caracteres, máximo 20 resultados).'
        schema:
          type: string
      - name: aplica_a
        in: query
        required: false
        description: 'Solo `motivos-reporte`: vacante, empresa o candidato (incluye los de «todos»).'
        schema:
          type: string
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
              example:
              - id: 1
                nombre: Python
                categoria_id: 1
              - id: 4
                nombre: Soporte técnico
                categoria_id: 1
        '404':
          description: '`no_encontrado`: El tipo de catálogo no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_encontrado:
                  value:
                    detail: El tipo de catálogo no existe.
                    codigo: no_encontrado
                    campos: null
  /dispositivos:
    post:
      tags:
      - Notificaciones
      summary: Registrar dispositivo para push
      operationId: post_dispositivos
      description: "Si el token ya existe, se reasigna al usuario actual.\n\n**Rol:** candidato, reclutador  \n**Trazabilidad:**\
        \ MOV-04 RF-01 · CU-02"
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispositivo'
            example:
              expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
              plataforma: android
      responses:
        '204':
          description: Sin contenido
        '401':
          description: '`no_autenticado`: Falta el token, es inválido o ya venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  value:
                    detail: Falta el token, es inválido o ya venció.
                    codigo: no_autenticado
                    campos: null
        '403':
          description: '`sin_permiso`: El rol del usuario no tiene acceso a este endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_permiso:
                  value:
                    detail: El rol del usuario no tiene acceso a este endpoint.
                    codigo: sin_permiso
                    campos: null
  /notificaciones:
    get:
      tags:
      - Notificaciones
      summary: Mis notificaciones
      operationId: get_notificaciones
      description: "Más recientes primero.\n\n**Rol:** candidato, reclutador  \n**Trazabilidad:** MOV-04 RF-02 · CU-05"
      parameters:
      - name: page
        in: query
        required: false
        description: Página, desde 1.
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        required: false
        description: Tamaño de página (máximo 100).
        schema:
          type: integer
          default: 20
      - name: solo_no_leidas
        in: query
        required: false
        description: true para traer solo las no leídas.
        schema:
          type: boolean
      security:
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaNotificaciones'
              example:
                items:
                - id: 1
                  tipo: cambio_estado
                  titulo: Tu postulación avanzó
                  mensaje: Tu postulación a Técnico de soporte de TI pasó a Entrevista.
                  referencia:
                    tipo: postulacion
                    id: 1
                  leida: false
                  creado_en: '2026-10-02T16:30:00Z'
                total: 1
                page: 1
                size: 20
        '401':
          description: '`no_autenticado`: Falta el token, es inválido o ya venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  value:
                    detail: Falta el token, es inválido o ya venció.
                    codigo: no_autenticado
                    campos: null
        '403':
          description: '`sin_permiso`: El rol del usuario no tiene acceso a este endpoint.'
          content:
