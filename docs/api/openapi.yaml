      - expo_push_token
      - plataforma
      additionalProperties: false
      examples:
      - expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        plataforma: android
    Logout:
      type: object
      properties:
        expo_push_token:
          type:
          - string
          - 'null'
