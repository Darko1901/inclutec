              type: integer
            reportes_abiertos:
              type: integer
          required:
          - empresas_por_validar
          - reportes_abiertos
          additionalProperties: false
        graficas:
          type: object
          properties:
            postulaciones_por_estado:
              type: array
              items:
                type: object
                properties:
                  etiqueta:
                    type: string
                  total:
                    type: integer
                required:
                - etiqueta
                - total
                additionalProperties: false
            vacantes_por_modalidad:
              type: array
              items:
                type: object
                properties:
                  etiqueta:
                    type: string
                  total:
