              accion: suspension
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteAdminDetalle'
              example:
                reporte:
                  id: 1
                  tipo: vacante
                  objeto:
                    id: 1
                    nombre: Técnico de soporte de TI · TecnoQro
                  motivo:
                    id: 4
                    nombre: Solicitud de pago al candidato
                  reportante:
                    id: 4
                    nombre: Jorge
                    apellidos: Ramírez Soto
                  estado: resuelto
                  creado_en: '2026-10-03T18:00:00Z'
                descripcion: Me pidieron un depósito para agendar la entrevista.
                resolucion: Se confirmó la solicitud de pago; la vacante fue suspendida.
                accion: suspension
                atendido_por:
                  id: 1
                  nombre: Admin
                  apellidos: IncluTec
                cerrado_en: '2026-10-03T19:00:00Z'
                historial:
                - estado_anterior: null
                  estado_nuevo: abierto
                  comentario: null
                  usuario: null
                  creado_en: '2026-10-03T18:00:00Z'
                - estado_anterior: abierto
                  estado_nuevo: resuelto
                  comentario: null
                  usuario:
                    id: 1
                    nombre: Admin
                  creado_en: '2026-10-03T19:00:00Z'
                objeto_estado: suspendida
                reportes_previos: []
        '401':
          description: '`no_autenticado`: Falta el token, es inválido o ya venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_autenticado:
                  value:
                    detail: Falta el token, es inválido o ya venció.
                    codigo: no_autenticado
                    campos: null
        '403':
          description: '`sin_permiso`: El rol del usuario no tiene acceso a este endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_permiso:
                  value:
                    detail: El rol del usuario no tiene acceso a este endpoint.
                    codigo: sin_permiso
                    campos: null
        '404':
          description: '`no_encontrado`: El recurso no existe o no es visible para este usuario.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_encontrado:
                  value:
                    detail: El recurso no existe o no es visible para este usuario.
                    codigo: no_encontrado
                    campos: null
        '409':
          description: '`transicion_invalida`: El reporte ya está cerrado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                transicion_invalida:
                  value:
                    detail: El reporte ya está cerrado.
                    codigo: transicion_invalida
                    campos: null
        '422':
          description: '`validacion`: Falta la resolución al cerrar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    detail: Falta la resolución al cerrar.
                    codigo: validacion
                    campos: null
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Mensaje claro en español para mostrar al usuario.
        codigo:
          type: string
          description: Código estable para que el cliente decida qué hacer (ver tabla de códigos).
        campos:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'Solo en errores de validación: mensaje por campo, con el nombre del campo del cuerpo.'
      required:
      - detail
      - codigo
      additionalProperties: false
      examples:
      - detail: Revisa los datos marcados.
        codigo: validacion
        campos:
          telefono: Debe tener 10 dígitos.
    Ref:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required:
      - id
      - nombre
      additionalProperties: false
      examples:
      - id: 1
        nombre: Tecnologías de la información
    Entidad:
      type: object
      properties:
        id:
          type: integer
          description: Clave INEGI.
        nombre:
          type: string
      required:
      - id
      - nombre
      additionalProperties: false
      examples:
      - id: 22
        nombre: Querétaro
    Municipio:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        entidad:
          $ref: '#/components/schemas/Entidad'
      required:
      - id
      - nombre
      - entidad
      additionalProperties: false
      examples:
      - id: 2
        nombre: El Marqués
        entidad:
          id: 22
          nombre: Querétaro
    NivelEducativo:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        orden:
          type: integer
          description: Posición jerárquica; mayor = más alto.
      required:
      - id
      - nombre
      - orden
      additionalProperties: false
      examples:
      - id: 4
        nombre: Técnico superior universitario
        orden: 4
    TamanoEmpresa:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        rango:
          type: string
      required:
      - id
      - nombre
      - rango
      additionalProperties: false
      examples:
      - id: 3
        nombre: Mediana
        rango: 51 a 250 trabajadores
    Habilidad:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required:
      - id
      - nombre
      additionalProperties: false
      examples:
      - id: 4
        nombre: Soporte técnico
    AjusteRef:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        categoria:
          type: string
          enum:
          - movilidad
          - visual
          - auditiva
          - comunicacion
          - cognitiva_psicosocial
          - general
      required:
      - id
      - nombre
      - categoria
      additionalProperties: false
      examples:
      - id: 1
        nombre: Acceso con rampa
        categoria: movilidad
    Ajuste:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        categoria:
          type: string
          enum:
          - movilidad
          - visual
          - auditiva
          - comunicacion
          - cognitiva_psicosocial
          - general
        descripcion:
          type: string
      required:
      - id
      - nombre
      - categoria
      - descripcion
      additionalProperties: false
      examples:
      - id: 1
        nombre: Acceso con rampa
        categoria: movilidad
        descripcion: Entrada y áreas de trabajo accesibles en silla de ruedas
    Paginacion:
      type: object
      properties:
        total:
          type: integer
          description: Total de registros que cumplen el filtro.
        page:
          type: integer
          description: Página actual (desde 1).
        size:
          type: integer
          description: Tamaño de página.
      required:
      - total
      - page
      - size
      additionalProperties: false
      examples:
      - total: 1
        page: 1
        size: 20
    CatalogoItem:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type:
          - string
          - 'null'
          description: Solo categorías y ajustes.
        categoria:
          type:
          - string
          - 'null'
          description: 'Solo ajustes: movilidad, visual, auditiva, comunicacion, cognitiva_psicosocial o general.'
        categoria_id:
          type:
          - integer
          - 'null'
          description: Solo habilidades.
        orden:
          type:
          - integer
          - 'null'
          description: Solo niveles educativos.
        rango:
          type:
          - string
          - 'null'
          description: Solo tamaños de empresa.
        aplica_a:
          type:
          - string
          - 'null'
          description: 'Solo motivos de reporte: vacante, empresa, candidato o todos.'
        entidad_federativa_id:
          type:
          - integer
          - 'null'
          description: Solo municipios.
      required:
      - id
      - nombre
      additionalProperties: false
      description: Elemento de un catálogo. Solo vienen los campos que aplican al tipo.
      examples:
      - id: 4
        nombre: Soporte técnico
        categoria_id: 1
    Usuario:
      type: object
      properties:
        id:
          type: integer
        correo:
          type: string
          format: email
        nombre:
          type: string
        apellidos:
          type: string
        telefono:
          type:
          - string
          - 'null'
        rol:
          type: string
          enum:
          - candidato
          - reclutador
          - administrador
        estado:
          type: string
          enum:
          - activo
          - suspendido
          - eliminado
        empresa:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            nombre_comercial:
              type: string
            estado:
              type: string
              enum:
              - pendiente
              - validada
              - rechazada
              - suspendida
          required:
          - id
          - nombre_comercial
          - estado
          additionalProperties: false
          description: 'Solo reclutadores: su empresa y el estado de validación.'
        consentimiento_sensibles:
          type:
          - boolean
          - 'null'
          description: 'Solo candidatos: si otorgó el consentimiento para tratar necesidades de ajuste.'
      required:
      - id
      - correo
      - nombre
      - apellidos
      - telefono
      - rol
      - estado
      - empresa
      - consentimiento_sensibles
      additionalProperties: false
      examples:
      - id: 3
        correo: mariana.lopez@correo.mx
        nombre: Mariana
        apellidos: López García
        telefono: '4427654321'
        rol: candidato
        estado: activo
        empresa: null
        consentimiento_sensibles: true
    Sesion:
      type: object
      properties:
        access_token:
          type: string
          description: 'JWT HS256. Se envía en cada petición como `Authorization: Bearer <token>`.'
        token_type:
          type: string
          enum:
          - bearer
        expira_en:
          type: string
          format: date-time
          description: Vencimiento del token (8 h después de emitirse).
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
      - access_token
      - token_type
      - expira_en
      - usuario
      additionalProperties: false
      examples:
      - access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzIiwicm9sIjoiY2FuZGlkYXRvIiwiZXhwIjoxNzkxMDgwMDAwfQ.firma
        token_type: bearer
        expira_en: '2026-10-04T02:00:00Z'
        usuario:
          id: 3
          correo: mariana.lopez@correo.mx
          nombre: Mariana
          apellidos: López García
          telefono: '4427654321'
          rol: candidato
          estado: activo
          empresa: null
          consentimiento_sensibles: true
    Login:
      type: object
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          minLength: 8
          maxLength: 64
      required:
      - correo
      - contrasena
      additionalProperties: false
      examples:
      - correo: mariana.lopez@correo.mx
        contrasena: Inclutec2026
    RegistroCandidato:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 254
        telefono:
          type: string
          pattern: ^[0-9]{10}$
          description: 10 dígitos.
        municipio_id:
          type: integer
        contrasena:
          type: string
          minLength: 8
          maxLength: 64
          description: 8 a 64 caracteres, con al menos una letra y un número.
        acepta_aviso:
          type: boolean
          description: Debe ser true.
        consentimiento_sensibles:
          type: boolean
          description: Consentimiento expreso para tratar necesidades de ajuste. Si es false, la cuenta se crea y esa sección
            queda deshabilitada.
      required:
      - nombre
      - apellidos
      - correo
      - telefono
      - municipio_id
      - contrasena
      - acepta_aviso
      - consentimiento_sensibles
      additionalProperties: false
      examples:
      - nombre: Mariana
        apellidos: López García
        correo: mariana.lopez@correo.mx
        telefono: '4427654321'
        municipio_id: 2
        contrasena: Inclutec2026
        acepta_aviso: true
        consentimiento_sensibles: true
    RegistroReclutador:
      type: object
      properties:
        reclutador:
          type: object
          properties:
            nombre:
              type: string
              maxLength: 80
            apellidos:
              type: string
              maxLength: 120
            puesto:
              type: string
              maxLength: 100
            correo:
              type: string
              format: email
            telefono:
              type: string
              pattern: ^[0-9]{10}$
            contrasena:
              type: string
              minLength: 8
              maxLength: 64
          required:
          - nombre
          - apellidos
          - puesto
          - correo
          - telefono
          - contrasena
          additionalProperties: false
        empresa:
          type: object
          properties:
            razon_social:
              type: string
              maxLength: 200
            nombre_comercial:
              type: string
              maxLength: 150
            rfc:
              type: string
              pattern: ^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$
              description: 12 o 13 caracteres en mayúsculas.
            sector_id:
              type: integer
            tamano_empresa_id:
              type: integer
            municipio_id:
              type: integer
          required:
          - razon_social
          - nombre_comercial
          - rfc
          - sector_id
          - tamano_empresa_id
          - municipio_id
          additionalProperties: false
        acepta_aviso:
          type: boolean
          description: Debe ser true.
      required:
      - reclutador
      - empresa
      - acepta_aviso
      additionalProperties: false
      examples:
      - reclutador:
          nombre: Laura
          apellidos: Hernández Ruiz
          puesto: Coordinadora de Recursos Humanos
          correo: rh@tecnoqro.mx
          telefono: '4421234567'
          contrasena: Inclutec2026
        empresa:
          razon_social: Tecnologías Querétaro S.A. de C.V.
          nombre_comercial: TecnoQro
          rfc: TQU150312AB1
          sector_id: 4
          tamano_empresa_id: 3
          municipio_id: 3
        acepta_aviso: true
    SolicitudCodigo:
      type: object
      properties:
        correo:
          type: string
          format: email
      required:
      - correo
      additionalProperties: false
      examples:
      - correo: mariana.lopez@correo.mx
    VerificacionCodigo:
      type: object
      properties:
        correo:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          description: 6 dígitos.
      required:
      - correo
      - codigo
      additionalProperties: false
      examples:
      - correo: mariana.lopez@correo.mx
        codigo: '482913'
    Restablecimiento:
      type: object
      properties:
        correo:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
        contrasena:
          type: string
          minLength: 8
          maxLength: 64
      required:
      - correo
      - codigo
      - contrasena
      additionalProperties: false
      examples:
      - correo: mariana.lopez@correo.mx
        codigo: '482913'
        contrasena: NuevaClave2026
    CambioContrasena:
      type: object
      properties:
        contrasena_actual:
          type: string
        contrasena_nueva:
          type: string
          minLength: 8
          maxLength: 64
      required:
      - contrasena_actual
      - contrasena_nueva
      additionalProperties: false
      examples:
      - contrasena_actual: Inclutec2026
        contrasena_nueva: NuevaClave2026
    Mensaje:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      additionalProperties: false
      examples:
      - detail: Si el correo está registrado, te enviamos un código de 6 dígitos.
    Dispositivo:
      type: object
      properties:
        expo_push_token:
          type: string
          maxLength: 255
        plataforma:
          type: string
