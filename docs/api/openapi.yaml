      - items
      - total
      - page
      - size
      additionalProperties: false
      examples:
      - items:
        - id: 1
          tipo: cambio_estado
          titulo: Tu postulación avanzó
          mensaje: Tu postulación a Técnico de soporte de TI pasó a Entrevista.
          referencia:
            tipo: postulacion
            id: 1
          leida: false
          creado_en: '2026-10-02T16:30:00Z'
        total: 1
        page: 1
        size: 20
    ResumenNotificaciones:
      type: object
      properties:
        no_leidas:
          type: integer
      required:
      - no_leidas
      additionalProperties: false
      examples:
      - no_leidas: 1
    PreferenciaNotificacion:
      type: object
      properties:
        tipo:
          type: string
          enum:
          - cambio_estado
          - nueva_postulacion
          - entrevista_agendada
          - entrevista_cancelada
          - recordatorio_entrevista
          - empresa_validada
          - empresa_rechazada
          - vacante_suspendida
          - reporte_resuelto
        push:
          type: boolean
        correo:
          type: boolean
      required:
      - tipo
      - push
      - correo
      additionalProperties: false
      examples:
      - tipo: cambio_estado
        push: true
        correo: true
    PerfilCandidato:
      type: object
      properties:
        usuario:
          type: object
          properties:
            id:
              type: integer
            nombre:
              type: string
            apellidos:
              type: string
            correo:
              type: string
            telefono:
              type:
              - string
              - 'null'
          required:
          - id
          - nombre
          - apellidos
          - correo
          - telefono
          additionalProperties: false
        municipio:
          anyOf:
          - $ref: '#/components/schemas/Municipio'
          - type: 'null'
        jornada:
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - type: 'null'
        resumen:
          type:
          - string
          - 'null'
          maxLength: 500
        foto_url:
          type:
          - string
          - 'null'
        disponible_reubicacion:
          type: boolean
        modalidades:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        categorias:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
        compartir_ajustes:
          type: string
          enum:
          - preguntar
          - siempre
          - nunca
        consentimiento_sensibles_en:
          type:
          - string
          - 'null'
          format: date-time
          description: null si no ha dado el consentimiento; entonces `necesidades` viene vacío.
        necesidades:
          type: array
          items:
            $ref: '#/components/schemas/AjusteRef'
        nota_ajustes:
          type:
          - string
          - 'null'
          maxLength: 300
        completitud:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 a 100. No depende de las necesidades de ajuste.
        secciones_pendientes:
          type: array
          items:
            type: string
            enum:
            - datos_personales
            - resumen
            - foto
            - preferencias
            - formacion
            - experiencia
            - habilidades
        perfil_minimo:
          type: boolean
          description: 'true si cumple lo necesario para postularse: nombre, municipio, al menos una habilidad y una formación.'
        actualizado_en:
          type: string
          format: date-time
      required:
      - usuario
      - municipio
      - jornada
      - resumen
      - foto_url
      - disponible_reubicacion
      - modalidades
      - categorias
      - compartir_ajustes
      - consentimiento_sensibles_en
      - necesidades
      - nota_ajustes
      - completitud
      - secciones_pendientes
      - perfil_minimo
      - actualizado_en
      additionalProperties: false
      examples:
      - usuario:
          id: 3
          nombre: Mariana
          apellidos: López García
          correo: mariana.lopez@correo.mx
          telefono: '4427654321'
        municipio:
          id: 2
          nombre: El Marqués
          entidad:
            id: 22
            nombre: Querétaro
        jornada:
          id: 1
          nombre: Tiempo completo
        resumen: Técnica en sistemas con experiencia en soporte y atención a usuarios.
        foto_url: null
        disponible_reubicacion: false
        modalidades:
        - id: 2
          nombre: Remoto
        - id: 3
          nombre: Híbrido
        categorias:
