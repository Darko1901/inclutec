      required: []
      additionalProperties: false
      examples:
      - expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
    Notificacion:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum:
