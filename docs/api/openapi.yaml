        leida: false
        creado_en: '2026-10-02T16:30:00Z'
    PaginaNotificaciones:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
