# Servicios de desarrollo de IncluTec.
# Por ahora solo la base de datos; el API se agrega en el sprint 4.
services:
  db:
    image: postgres:16
    container_name: inclutec-db
    environment:
      POSTGRES_DB: inclutec
      POSTGRES_USER: inclutec
      POSTGRES_PASSWORD: inclutec_dev
    ports:
      - "5432:5432"
    volumes:
      - ./db:/db:ro
      - ./db/scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-inclutec.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inclutec -d inclutec"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
